[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anaj-erp"
version = "0.1.0"
description = "Offline keyboard-first accounting ERP for Haryana grain commission agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography",
  "platformdirs",
  "pywebview",
  "reportlab",
]

[project.optional-dependencies]
server = [
  "fastapi",
  "uvicorn[standard]",
]
integrations = [
  "google-api-python-client",
  "google-auth",
]
export = [
  "openpyxl>=3.1.0",
  "python-docx>=1.1.0",
  "Pillow>=10.0.0",
]
dev = [
  "fastapi",
  "httpx",
  "mypy",
  "openpyxl>=3.1.0",
  "Pillow>=10.0.0",
  "pyinstaller",
  "pytest",
  "pytest-cov",
  "python-docx>=1.1.0",
  "ruff",
  "types-reportlab",
  "uvicorn[standard]",
]

[project.scripts]
anaj-erp = "anaj_erp.main:main"
anaj-erp-server = "anaj_erp.server_stub:main"
anaj-fleet-portal = "anaj_erp.run_fleet_entry:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/anaj_erp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["backend"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
